name: Rebuild results cache

# Rebuilds data/results_cache.csv whenever you push updated FA xlsx exports.
# There is no scraping: the Norwegian FA match export needs a browser session,
# so you download kamper_<year>.xlsx yourself and commit it. This Action then
# regenerates the CSV the Shiny app reads, so you never hand-edit the CSV.

on:
  push:
    paths:
      - "data/kamper_*.xlsx"     # triggers only when you add/update an export
  workflow_dispatch:             # or run it manually from the Actions tab

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-rpkgs-${{ hashFiles('update_cache.R') }}

      - name: Install dependencies
        run: install.packages(c("dplyr","readr","lubridate","readxl","tibble"))
        shell: Rscript {0}

      - name: Rebuild cache
        run: Rscript update_cache.R

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results_cache.csv
          if git diff --staged --quiet; then
            echo "Cache unchanged."
          else
            git commit -m "Rebuild results cache ($(date -u +%Y-%m-%d))"
            git push
          fi
