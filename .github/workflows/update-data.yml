name: Rebuild results cache

# Fetches Eliteserien results/fixtures and the UEFA schedule for Norwegian
# clubs from ESPN's public API, rebuilds data/results_cache.csv and
# data/europe_cache.csv, and stamps data/last_updated.txt. No manual
# downloads needed. The Shiny app reads all three files from this repo.
#
# The timestamp changes on every run, so there is one commit per day. That
# lets the app show when the data was last checked, and keeps the repo
# active so GitHub never pauses the schedule.

on:
  schedule:
    - cron: "30 22 * * *"   # daily, 22:30 UTC = after the evening kick-offs
  workflow_dispatch:         # or run it manually from the Actions tab

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true    # prebuilt Linux binaries, fast installs

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::readr
            any::lubridate
            any::tibble
            any::jsonlite
            any::curl

      - name: Rebuild cache
        run: Rscript update_cache.R

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/results_cache.csv data/europe_cache.csv data/last_updated.txt
          if git diff --staged --quiet; then
            echo "Cache unchanged."
          else
            git commit -m "Update results cache ($(date -u +%Y-%m-%d))"
            git push
          fi
